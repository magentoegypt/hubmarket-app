# build_runner configuration.
#
# graphql_codegen turns the `.graphql` files in the repo into typed Dart:
#   - lib/core/graphql/schema.graphql   ← the live-introspected SDL (type system),
#     written by `python tool/introspect_to_sdl.py` and committed.
#   - lib/<feature>/data/graphql/*.graphql  ← executable operations (Phase 1+).
# Output: a `<name>.graphql.dart` next to each operation file (gitignored).
#
# lib/core/graphql/hubapp.graphql (the Hub Market App contract, not deployed
# yet) is kept out of both: it re-declares live types the Magento way
# (`type Query { hm… }`), which would replace the live definitions in the
# codegen schema. Its operations are inline Dart strings, checked by
# tool/validate_ops.py against live + contract. The `.graphql` fixtures of
# tool/validate_ops.py's own tests (tool/fixtures/) are SDL too, and
# graphql_codegen crashes on them, so tool/ is excluded as well.
#
# Run: dart run build_runner build --delete-conflicting-outputs
#
# State management stays plain Riverpod (no riverpod_generator).
targets:
  $default:
    builders:
      graphql_codegen:
        generate_for:
          exclude:
            - lib/core/graphql/hubapp.graphql
            - tool/**
        options:
          # The schema and operation files codegen reads (default: every
          # `.graphql` under lib/, which would include hubapp.graphql).
          assetsPath: "lib/{core/graphql/schema.graphql,features/**.graphql}"
          # Generate graphql_flutter-flavoured helpers (Query/Mutation widgets,
          # Options classes) alongside the typed data classes.
          clients:
            - graphql_flutter
          # Add __typename to selection sets so the normalized cache can dedupe.
          addTypename: true
          # Map Magento custom scalars to Dart types as they surface in the
          # schema (most are plain String/Float). Extend per scalar, e.g.:
          #   scalars:
          #     EmailAddress: { type: String }
          scalars: {}
