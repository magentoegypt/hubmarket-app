# Single product by url_key for the PDP: gallery, description, price, reviews,
# and (for configurable products) the swatch options + per-variant price/stock.
# Reviews degrade to the empty state when absent (store has zero — no fake stars).
# Configurable-swatch modeling is the remaining item to verify on live data.
query ProductDetail($urlKey: String!) {
  products(filter: { url_key: { eq: $urlKey } }, pageSize: 1) {
    items {
      __typename
      sku
      name
      url_key
      stock_status
      is_new_arrival
      is_bestseller
      rating_summary
      review_count
      rating_histogram {
        stars
        count
        percent
      }
      also_like_products(pageSize: 8) {
        sku
        name
        url_key
        stock_status
        image {
          url
        }
        price_range {
          minimum_price {
            regular_price {
              value
              currency
            }
            final_price {
              value
              currency
            }
          }
        }
      }
      reviews(pageSize: 20) {
        items {
          nickname
          summary
          text
          average_rating
          created_at
        }
      }
      description {
        html
      }
      short_description {
        html
      }
      image {
        url
      }
      media_gallery {
        url
        label
      }
      price_range {
        minimum_price {
          regular_price {
            value
            currency
          }
          final_price {
            value
            currency
          }
        }
      }
      ... on ConfigurableProduct {
        configurable_options {
          attribute_code
          label
          values {
            uid
            value_index
            label
            swatch_data {
              value
            }
          }
        }
        variants {
          attributes {
            code
            value_index
          }
          product {
            sku
            stock_status
            image {
              url
            }
            price_range {
              minimum_price {
                regular_price {
                  value
                  currency
                }
                final_price {
                  value
                  currency
                }
              }
            }
          }
        }
      }
    }
  }
}
