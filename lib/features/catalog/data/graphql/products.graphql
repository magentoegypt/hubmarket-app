# Product listing — drives home featured, PLP, and search results.
# `search`/`filter` are individually optional but Magento needs at least one.
# `aggregations` builds the PLP filter panel dynamically. Checked on Hub Market
# (2026-09-29): real SKUs with AED price_range + stock_status. The NEW badge
# reads Magento's core `new_from_date` / `new_to_date` — the store has no
# NEW/bestseller flags of its own. Codegen mirror of CatalogQueries.products.
query Products(
  $search: String
  $filter: ProductAttributeFilterInput
  $sort: ProductAttributeSortInput
  $pageSize: Int!
  $currentPage: Int!
) {
  products(
    search: $search
    filter: $filter
    sort: $sort
    pageSize: $pageSize
    currentPage: $currentPage
  ) {
    total_count
    page_info {
      current_page
      total_pages
      page_size
    }
    items {
      sku
      name
      url_key
      stock_status
      new_from_date
      new_to_date
      rating_summary
      review_count
      image {
        url
        label
      }
      price_range {
        minimum_price {
          regular_price {
            value
            currency
          }
          final_price {
            value
            currency
          }
        }
      }
    }
    aggregations {
      attribute_code
      label
      options {
        label
        value
        count
      }
    }
  }
}
