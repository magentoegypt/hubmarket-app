# Product search — the Products listing plus each hit's `categories`, which the
# type-ahead names ("in Home Furniture") and ranks its category links by. Hub
# Market answers `products(search:)` through Algolia (the storefront's adapter),
# so ranking, total_count and the `category_uid` aggregation match the website.
# Checked 2026-09-29: `categories.include_in_menu` is an Int (0/1).
# Codegen mirror of CatalogQueries.searchProducts.
query SearchProducts(
  $search: String!
  $filter: ProductAttributeFilterInput
  $sort: ProductAttributeSortInput
  $pageSize: Int!
  $currentPage: Int!
) {
  products(
    search: $search
    filter: $filter
    sort: $sort
    pageSize: $pageSize
    currentPage: $currentPage
  ) {
    total_count
    page_info {
      current_page
      total_pages
      page_size
    }
    items {
      sku
      name
      url_key
      stock_status
      new_from_date
      new_to_date
      image {
        url
        label
      }
      price_range {
        minimum_price {
          regular_price {
            value
            currency
          }
          final_price {
            value
            currency
          }
        }
      }
      categories {
        uid
        name
        level
        include_in_menu
      }
    }
    aggregations {
      attribute_code
      label
      options {
        label
        value
        count
      }
    }
  }
}
