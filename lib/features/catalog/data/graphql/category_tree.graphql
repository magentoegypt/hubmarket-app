# Category tree (three levels under the root) — categories screen, PLP
# sub-category rail, menu. Checked on Hub Market (2026-09-29): one root
# ("Default Category") whose children are the browsable set; include_in_menu
# comes back as Int 0/1 (the repository coerces it; 0 is hidden in navigation).
# Codegen mirror of CatalogQueries.categoryTree.
query CategoryTree {
  categoryList {
    uid
    name
    url_key
    children {
      uid
      name
      url_key
      image
      include_in_menu
      product_count
      children {
        uid
        name
        url_key
        image
        include_in_menu
        product_count
        children {
          uid
          name
          url_key
          image
          include_in_menu
          product_count
        }
      }
    }
  }
}
