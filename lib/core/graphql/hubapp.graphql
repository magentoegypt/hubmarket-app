    policy_html: String @doc(description: "Policy CMS block HTML.")
    window_days: Int @doc(description: "Days after order creation; null = no window (website rule for customers).")
    attachment_extensions: [String!]! @doc(description: "File extensions a message may carry, lower case: the RMA Allowed file extensions setting the website's upload uses, less the store's protected extensions.")
    attachment_max_bytes: Int! @doc(description: "Largest file in bytes: the store's upload limit, as on the website, at most 10 MB.")
    attachment_max_files: Int! @doc(description: "Most files one message may carry.")
}

type HmReturnReason @doc(description: "Reason.") {
