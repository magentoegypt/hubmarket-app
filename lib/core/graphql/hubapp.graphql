    price: Money! @doc(description: "Final price for the customer group, the lowest one for a configurable offer: what price_range.minimum_price.final_price says on the offer's page.")
    regular_price: Money! @doc(description: "Price before discounts; equal to price when there is none.")
    stock_status: ProductStockStatus! @doc(description: "Stock status. The website lists only offers in stock, so every listed offer is IN_STOCK.")
