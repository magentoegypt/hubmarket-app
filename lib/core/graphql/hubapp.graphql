# falls back to Build 1 when the live server lacks the hm* fields.
# tool/validate_ops.py overlays this file on the live introspection by default
# (--live-only skips it): Magento-style re-declarations (type Query, interface
# ProductInterface, ...) add their fields to the live types. It is not an
