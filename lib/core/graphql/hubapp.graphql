    total_count: Int! @doc(description: "Sellers matching.")
    page_info: SearchResultPageInfo! @doc(description: "Paging.")
}

type HmProductOffer @doc(description: "Another seller's offer on the same product: a Vnecoms select-and-sell copy, a product of its own with its own SKU, price and stock, or on a copy's page the product it was copied from. Only what the website's price comparison lists: an approved seller of its own, sellable in the store view and in stock.") {
    uid: ID! @doc(description: "Product uid of the offer.")
    sku: String! @doc(description: "SKU to add to the cart, as for any product.")
