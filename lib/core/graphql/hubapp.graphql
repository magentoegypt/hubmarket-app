    primary_category: HmCategoryCount @resolver(class: "MagentoEgypt\\HubAppVendors\\Model\\Resolver\\StoreCardCategory") @doc(description: "Top-level menu category holding most of the seller's listable products, count being how many are in it; null when none is filed in one.") @cache(cacheIdentity: "MagentoEgypt\\HubAppVendors\\Model\\Resolver\\Identity\\CategoryCountIdentity")
    facet_value: String @resolver(class: "MagentoEgypt\\HubAppVendors\\Model\\Resolver\\StoreCardFacetValue") @doc(description: "The seller's value in the storefront's Algolia seller facet, the product records' seller attribute, in this store view: match facet counts to stores on it, not on name. Null when records carry no seller.")
