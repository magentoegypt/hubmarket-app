    hm_offer_count: Int! @resolver(class: "MagentoEgypt\\HubAppVendors\\Model\\Resolver\\ProductOfferCount") @doc(description: "How many other sellers offer this product, the website's Sold by N other sellers; 0 when none. Public; ask with the product as GET.")
