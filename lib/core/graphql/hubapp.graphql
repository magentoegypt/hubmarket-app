    can_reply: Boolean! @doc(description: "hmAddReturnMessage is taken: state open, awaiting or being reviewed, when the website shows its reply form.")
    can_cancel: Boolean! @doc(description: "hmCancelReturn is taken: status pending or approval, when the website shows Cancel.")
    can_escalate: Boolean! @doc(description: "hmEscalateReturn is taken: not cancelled and never escalated, when the website shows Escalate RMA.")
    escalation: HmReturnEscalation @doc(description: "The customer's escalation to Hub Market, as the website's RMA Escalate tab shows it; null before one.")
}

type HmReturnEscalation @doc(description: "The customer's escalation to Hub Market.") {
    body_html: String! @doc(description: "Sanitised HTML.")
    body_text: String! @doc(description: "Plain text.")
    attachments: [HmReturnAttachment!]! @doc(description: "Files sent with it.")
    created_at: String! @doc(description: "When, UTC.")
}

type HmReturnItem @doc(description: "Returned line.") {
    order_item_id: Int! @doc(description: "Order line id.")
    sku: String! @doc(description: "SKU.")
    name: String! @doc(description: "Name.")
    image_url: String @doc(description: "Thumbnail.")
    quantity: Float! @doc(description: "Qty requested.")
}

type HmReturnHistoryEntry @doc(description: "Status change.") {
    status_code: String! @doc(description: "Status code.")
    status_label: String! @doc(description: "Localised label.")
    changed_by: HmReturnActor! @doc(description: "Actor role.")
    created_at: String! @doc(description: "When, UTC.")
}

type HmReturnMessage @doc(description: "Message.") {
    id: Int! @doc(description: "Id.")
    author: HmReturnActor! @doc(description: "Role.")
    author_name: String! @doc(description: "Customer or seller name; 'Hub Market' for staff.")
    body_html: String! @doc(description: "Sanitised HTML.")
    body_text: String! @doc(description: "Plain text.")
    attachment_urls: [String!]! @doc(description: "Attachment URLs (read-only in P2).")
    created_at: String! @doc(description: "When, UTC.")
    attachments: [HmReturnAttachment!]! @doc(description: "Files on the message, in the order sent: name and URL.")
}

type HmReturnAttachment @doc(description: "A file on a message.") {
    name: String! @doc(description: "File name as stored.")
    url: String! @doc(description: "Absolute HTTPS URL.")
}


# ===================== HubAppAccount/etc/schema.graphqls (C) =====================

type Query {
    hmStoreCredit(
        pageSize: Int = 20 @doc(description: "Transactions per page, 1-50."),
        currentPage: Int = 1 @doc(description: "Page number from 1.")
    ): HmStoreCreditAccount! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\StoreCredit") @doc(description: "Balance and transactions. Token.") @cache(cacheable: false)
}

type Mutation {
    hmApplyStoreCredit(
        input: HmApplyStoreCreditInput! @doc(description: "Cart and amount.")
    ): HmStoreCreditCartOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\ApplyStoreCredit") @doc(description: "Use credit on the cart: group allowed, amount <= balance, capped at order total. Token.")
    hmRemoveStoreCredit(
        input: HmRemoveStoreCreditInput! @doc(description: "Cart.")
    ): HmStoreCreditCartOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\RemoveStoreCredit") @doc(description: "Stop using credit on the cart. Token.")
    hmAddCreditToCart(
        input: HmAddCreditToCartInput! @doc(description: "Cart and amount.")
    ): AddProductsToCartOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\AddCreditToCart") @doc(description: "Buy store credit: adds the website's credit product for this amount, as its Buy Credit page sells it. Paid into the balance when the order's invoice is paid. The customer's own cart. Token.")
    hmRegisterDevice(
        input: HmRegisterDeviceInput! @doc(description: "Device.")
    ): HmDeviceOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\RegisterDevice") @doc(description: "Upsert FCM token; bound to the customer when a token is sent, guest otherwise. Idempotent.")
    hmUnregisterDevice(
        input: HmUnregisterDeviceInput! @doc(description: "Device.")
    ): HmDeviceOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\UnregisterDevice") @doc(description: "Deactivate the token for this caller. Idempotent.")
    hmSendWhatsAppCode(
        input: HmSendWhatsAppCodeInput! @doc(description: "Number.")
    ): HmSendWhatsAppCodeOutput! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\SendWhatsAppCode") @doc(description: "Send a LOGIN code to the matching account's stored number. Anonymous.")
    hmSignInWithWhatsAppCode(
        input: HmSignInWithWhatsAppCodeInput! @doc(description: "Number and code.")
    ): CustomerToken! @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\SignInWithWhatsAppCode") @doc(description: "Exchange a code for a customer token. Five wrong codes for a number lock code sign-in for that number for 15 minutes, never the account. Anonymous.")
}

type Cart {
    hm_store_credit: HmCartStoreCredit @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\CartStoreCredit") @doc(description: "Store credit on this cart; null for guests.")
}

type OrderTotal {
    hm_store_credit: Money @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\OrderStoreCredit") @doc(description: "Credit used (sales_order.credit_amount); null when none.")
}

type HmStoreCreditAccount @doc(description: "Credit account.") {
    balance: Money! @doc(description: "Balance.")
    can_use_at_checkout: Boolean! @doc(description: "Customer group allowed (credit/general/credit_group).")
    transactions: [HmStoreCreditTransaction!]! @doc(description: "Newest first.")
    total_count: Int! @doc(description: "Transactions.")
    page_info: SearchResultPageInfo! @doc(description: "Paging.")
    top_up: HmStoreCreditTopUp @resolver(class: "MagentoEgypt\\HubAppAccount\\Model\\Resolver\\StoreCreditTopUp") @doc(description: "How credit is bought here: the store credit products the website's Buy Credit page sells; null when it sells none.")
}

type HmStoreCreditTransaction @doc(description: "Transaction.") {
    id: Int! @doc(description: "Id.")
    type: String! @doc(description: "Processor code, e.g. spend_credit.")
    type_label: String! @doc(description: "Localised processor title.")
    amount: Money! @doc(description: "Signed amount.")
    balance_after: Money! @doc(description: "Balance after.")
    description: String @doc(description: "Plain-text description.")
    created_at: String! @doc(description: "When, UTC.")
    order_number: String @doc(description: "The customer's own order this transaction records: spent on, refunded, cancelled or credit bought. Null otherwise.")
}

type HmStoreCreditTopUp @doc(description: "Buying credit.") {
    sku: String! @doc(description: "Credit product a custom amount buys; the first preset's when there is none.")
    min: Money @doc(description: "Smallest custom amount, whole units; null when only presets can be bought.")
    max: Money @doc(description: "Largest custom amount; null when only presets can be bought.")
    credit_rate: Float @doc(description: "Credit per 1 paid for a custom amount: the price is the amount divided by it. Null without a custom amount.")
    presets: [HmStoreCreditPreset!]! @doc(description: "Fixed amounts on sale, smallest first.")
}

type HmStoreCreditPreset @doc(description: "A credit amount on sale.") {
    sku: String! @doc(description: "Its credit product.")
    credit: Money! @doc(description: "Credit added to the balance.")
    price: Money! @doc(description: "Price of the cart line.")
}

input HmAddCreditToCartInput @doc(description: "Credit top-up.") {
    cart_id: String! @doc(description: "Masked id of the customer's cart.")
    amount: Float! @doc(description: "Credit to buy: a preset's credit, or a whole amount from min to max.")
}

input HmApplyStoreCreditInput @doc(description: "Apply credit.") {
    cart_id: String! @doc(description: "Masked cart id.")
    amount: Float! @doc(description: "Amount in store currency, > 0.")
}

input HmRemoveStoreCreditInput @doc(description: "Remove credit.") {
    cart_id: String! @doc(description: "Masked cart id.")
}

type HmStoreCreditCartOutput @doc(description: "Result.") {
    cart: Cart! @doc(description: "Recollected cart.")
}

type HmCartStoreCredit @doc(description: "Cart credit.") {
    applied: Money! @doc(description: "Applied now.")
    balance: Money! @doc(description: "Account balance.")
    max_applicable: Money! @doc(description: "min(balance, subtotal after discount + shipping + tax).")
    can_use: Boolean! @doc(description: "Group allowed.")
}

input HmRegisterDeviceInput @doc(description: "Device registration.") {
    token: String! @doc(description: "FCM registration token (<=500 chars).")
    platform: HmPlatform! @doc(description: "Platform.")
    app_version: String @doc(description: "App semver.")
}

input HmUnregisterDeviceInput @doc(description: "Device removal.") {
    token: String! @doc(description: "FCM token.")
}

type HmDeviceOutput @doc(description: "Result.") {
    success: Boolean! @doc(description: "Always true unless input is invalid.")
}

input HmSendWhatsAppCodeInput @doc(description: "Send code.") {
    mobile: String! @doc(description: "E.164 number, e.g. +9715XXXXXXXX.")
}

type HmSendWhatsAppCodeOutput @doc(description: "Send result.") {
    sent: Boolean! @doc(description: "True; also for unknown numbers unless hubapp/otp/reveal_unknown_number.")
    message: String! @doc(description: "Localised message to show.")
    resend_after_seconds: Int! @doc(description: "Cooldown before the next request.")
    status: HmOtpSendStatus! @doc(description: "What happened. Only THROTTLED or MASKED unless hubapp/otp/reveal_unknown_number.")
}

enum HmOtpSendStatus @doc(description: "Outcome of a code request.") {
    SENT @doc(description: "A code went to the account's number. Reveal setting on.")
    COOLDOWN @doc(description: "A code went to this number moments ago and still works; none sent within the resend period. Reveal setting on.")
    THROTTLED @doc(description: "Too many requests for this number or address; see resend_after_seconds. Any setting.")
    MASKED @doc(description: "The one answer for every number, with or without an account. Reveal setting off.")
    NO_ACCOUNT @doc(description: "No account uses this number. Reveal setting on.")
    MULTIPLE @doc(description: "Several accounts use this number; sign in by email. Reveal setting on.")
    UNDELIVERABLE @doc(description: "The account's stored number cannot get codes; sign in by email. Reveal setting on.")
    FAILED @doc(description: "The code could not be sent; try again later. Reveal setting on.")
}

input HmSignInWithWhatsAppCodeInput @doc(description: "Sign-in.") {
    mobile: String! @doc(description: "Same number as sent.")
    code: String! @doc(description: "6-digit code.")
}


# ===================== HubAppOrders/etc/schema.graphqls (P3.1) =====================

type CustomerOrder {
    hm_packages: [HmOrderPackage!]! @resolver(class: "MagentoEgypt\\HubAppOrders\\Model\\Resolver\\OrderPackages") @doc(description: "The order split by store the way Vnecoms splits it into vendor orders: one package per store, in the order the stores first appear among the lines. Hub Market's own lines have no vendor order and form a package of their own. Also on guestOrder and guestOrderByToken; one batch for every order of a response.")
}

type HmOrderPackage @doc(description: "One store's part of an order: a Vnecoms vendor order, or Hub Market's own lines.") {
    seller: HmSellerSummary @doc(description: "Who sells the package; Hub Market for its own lines; null when the seller is no longer approved.")
    status_code: String! @doc(description: "Order status code of the vendor order, e.g. processing. Hub Market's own lines take the order's status.")
    status_label: String! @doc(description: "The status as the website names it, in the store view's language.")
    state: String! @doc(description: "Magento order state behind the status: new, pending_payment, processing, complete, closed, canceled, holded or payment_review.")
    item_uids: [ID!]! @doc(description: "OrderItemInterface.id of the package's lines, top-level lines only.")
    subtotal: Money! @doc(description: "Items subtotal as the vendor order holds it. Hub Market's own lines are summed the way Vnecoms sums a vendor order.")
    discount: Money @doc(description: "Discount on the package, as a positive amount; null when none.")
    tax: Money @doc(description: "Tax on the package; null when none.")
    shipping_amount: Money @doc(description: "Delivery charged for this store when the order paid delivery per store (Vnecoms per-seller shipping); null when one delivery charge covered the whole order, see CustomerOrder.total.total_shipping.")
    shipping_method: String @doc(description: "This store's delivery method when delivery was chosen per store; null otherwise.")
    grand_total: Money! @doc(description: "Package total as the vendor order holds it: subtotal - discount + tax + shipping_amount.")
    shipments: [HmOrderPackageShipment!]! @doc(description: "Shipments of the package's lines, oldest first.")
    comments: [HmOrderPackageComment!]! @doc(description: "Comments the store made visible on the storefront for this package (the website lists them under About Your Order), oldest first.")
}

type HmOrderPackageShipment @doc(description: "A shipment of a package.") {
    id: ID! @doc(description: "Same value as OrderShipment.id.")
    number: String! @doc(description: "Shipment number.")
    created_at: String! @doc(description: "Created, ISO-8601 UTC.")
    tracks: [HmOrderPackageTrack!]! @doc(description: "Tracking numbers in the order they were added; empty when the store shipped without one.")
}

type HmOrderPackageTrack @doc(description: "A shipment tracking number.") {
    carrier_code: String! @doc(description: "custom for a carrier typed by hand, else the Magento carrier code, e.g. dhl.")
    carrier_title: String! @doc(description: "Carrier name saved with the number.")
    number: String! @doc(description: "Tracking number.")
    tracking_url: String @doc(description: "The carrier's public tracking page for this number when one can be built from its code (dhl, fedex, ups, usps); null otherwise, e.g. for a custom carrier.")
}

type HmOrderPackageComment @doc(description: "A comment shown to the customer.") {
    message: String! @doc(description: "Plain text.")
    created_at: String! @doc(description: "When, ISO-8601 UTC.")
}
