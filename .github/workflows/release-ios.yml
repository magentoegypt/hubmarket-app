name: Release · iOS

# Builds the prod iOS app on a hosted macOS runner — no local Mac needed.
# Signs with the committed Apple Distribution cert (ios/signing/*.p12 +
# IOS_P12_PASSWORD) — no fastlane `match`, no separate signing repo.
#   - testflight → App Store IPA (Hub Market Shop AppStore profile) → TestFlight
#   - adhoc      → ad-hoc IPA (device UDIDs in the ad-hoc profile) → artifact / Loadly
#
# testflight needs the APP_STORE_CONNECT_* secrets (see docs/decisions/ci.md) and
# an existing App Store Connect app record for com.hubmarket.app. adhoc needs only
# IOS_P12_PASSWORD (installs on the ad-hoc profile's registered device UDIDs).
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "testflight (App Store) or adhoc (Diawi / device install)"
        type: choice
        default: testflight
        options: [testflight, adhoc]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # firebase-ios-sdk 12.15 (via firebase_messaging 16.4.1) needs Xcode
      # 16.3+ (swift-tools 6.1); macos-15 + latest stable Xcode satisfies it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44's SPM plugin copy rsyncs into build/ios/SourcePackages/
      # during pub get; pre-create it so the copy doesn't fail on a fresh
      # checkout (see build-on-push.yml for the full note).
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # ---- App Store / TestFlight ----
      - name: Build signed App Store IPA
        if: ${{ inputs.distribution == 'testflight' }}
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: bash tool/ios_appstore_build.sh

      - name: Upload to TestFlight (fastlane pilot)
        if: ${{ inputs.distribution == 'testflight' }}
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
        run: |
          bundle install
          bundle exec fastlane beta

      # ---- Ad-hoc (Diawi / device install) ----
      - name: Build signed ad-hoc IPA
        if: ${{ inputs.distribution == 'adhoc' }}
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: bash tool/ios_sign_build.sh

      - name: Upload IPA (ad-hoc) artifact
        if: ${{ inputs.distribution == 'adhoc' }}
        uses: actions/upload-artifact@v4
        with:
          name: ipa-adhoc-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # Ad-hoc only — OTA-distribute the signed .ipa to Loadly (skips when
      # LOADLY_API_KEY is unset; see tool/loadly_upload.sh).
      - name: Distribute IPA to Loadly (when configured)
        if: ${{ inputs.distribution == 'adhoc' }}
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          ipa="$(ls build/ios/ipa/*.ipa | head -n1)"
          bash tool/loadly_upload.sh "$ipa" "adhoc release"
