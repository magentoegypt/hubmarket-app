name: Introspect Live GraphQL

# Manual run. The Actions runner can reach hub-market.magento2.click (unlike the agent
# sandbox), so this is how we discover the real store codes + check whether the
# MagentoEgypt_PaymentGraphQl module is deployed. Output is printed to the log
# AND uploaded as an artifact.
#
# Secret: HUB MARKET_API_TOKEN (optional — discovery is a public query and needs no
# token; it's forwarded as a bearer only if set, for authenticated checks).
on:
  workflow_dispatch:
    inputs:
      store_en:
        description: "EN store code (leave blank on the first run; fill in once discovered)"
        required: false
        default: ""
      store_ar:
        description: "AR store code (leave blank on the first run)"
        required: false
        default: ""

permissions:
  contents: write   # to commit the refreshed schema.graphql back to main

jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The `graphql` package powers tool/json_to_sdl.mjs (introspection → SDL),
      # which tool/introspect.sh runs automatically when it's installed.
      - name: Install SDL converter dep
        run: npm install graphql@16

      - name: Run introspection against the live endpoint
        env:
          ENDPOINT: https://hub-market.magento2.click/graphql
          TOKEN: ${{ secrets.HUB MARKET_API_TOKEN }}
          STORE_EN: ${{ inputs.store_en }}
          STORE_AR: ${{ inputs.store_ar }}
        run: |
          # Empty inputs fall back to the script's provisional defaults; the
          # header-less availableStores/storeConfig discovery runs regardless.
          [ -n "$STORE_EN" ] || unset STORE_EN
          [ -n "$STORE_AR" ] || unset STORE_AR
          bash tool/introspect.sh | tee introspect-output.txt

      - name: Upload output + schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: introspection
          path: |
            introspect-output.txt
            lib/core/graphql/schema.graphql
            lib/core/graphql/schema.introspection.json
          if-no-files-found: warn

      # Commit the refreshed SDL so the repo always has the latest live schema
      # for graphql_codegen. [skip ci] keeps it from triggering a build-on-push.
      - name: Commit refreshed schema.graphql (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/graphql/schema.graphql
          if git diff --cached --quiet; then
            echo "schema.graphql unchanged — nothing to commit."
          else
            git commit -m "chore(schema): refresh GraphQL SDL from live introspection [skip ci]"
            git push origin HEAD:main
          fi
