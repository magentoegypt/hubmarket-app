name: Build · iOS IPA (manual)

# Manual until Hub Market has an Apple Developer team, bundle id
# com.hubmarket.app and signing material. Without them this produces an
# UNSIGNED IPA (sideload / re-sign only).
on:
  workflow_dispatch:

jobs:
  # Runs on macOS (uses macOS minutes). Produces a signed ad-hoc IPA when the
  # IOS_P12_BASE64, IOS_P12_PASSWORD and IOS_ADHOC_PROFILE_BASE64 secrets are
  # set (see release-ios.yml; the repo is public, so signing files are never
  # committed — no fastlane match); otherwise an unsigned IPA.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # firebase_messaging 16.4.1 -> firebase-ios-sdk 12.15 declares
      # swift-tools-version 6.1, which needs Xcode 16.3+. macos-14 tops out at
      # ~16.2 (Swift 6.0) and fails SPM resolution, so run on macos-15 and pin
      # the newest stable Xcode for a deterministic toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44 enables Swift Package Manager by default and, during
      # `flutter pub get`, copies SPM-compatible plugins (firebase_messaging,
      # firebase_core) into build/ios/SourcePackages/ via rsync. On a fresh
      # checkout that parent dir doesn't exist and rsync won't create it, so
      # pub get fails with "Failed to copy plugin … mkdir … No such file or
      # directory". Pre-creating the dir lets the copy succeed. The project
      # genuinely uses SPM (Runner.xcodeproj references the generated package,
      # no Podfile), so disabling SPM is not an option.
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Signing material only ever comes from secrets (public repo): decoded
      # into the git-ignored ios/signing/ when all of it is set.
      - name: Decode the ad-hoc signing certificate and profile (when set)
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_ADHOC_PROFILE_BASE64" ]; then
            mkdir -p ios/signing
            printf '%s' "$IOS_P12_BASE64" | base64 --decode > ios/signing/distribution.p12
            printf '%s' "$IOS_ADHOC_PROFILE_BASE64" | base64 --decode > ios/signing/adhoc.mobileprovision
          fi

      - name: Build iOS IPA (signed ad-hoc from the secrets, else unsigned)
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -n "$IOS_P12_PASSWORD" ] && ls ios/signing/*.p12 >/dev/null 2>&1; then
            # Signed ad-hoc IPA from the decoded cert (.p12) + ad-hoc profile
            # in ios/signing/ — no fastlane match, no separate signing repo.
            # → build/ios/ipa/*.ipa (installs OTA on the profile's devices).
            bash tool/ios_sign_build.sh
          else
            echo "::warning::No iOS signing secrets — set IOS_P12_BASE64, IOS_P12_PASSWORD and IOS_ADHOC_PROFILE_BASE64 (see release-ios.yml) for a SIGNED ad-hoc IPA; never commit signing files, the repo is public. Building an UNSIGNED IPA (sideload/resign via AltStore / Sideloadly)."
            flutter build ios --release --no-codesign \
              -t lib/main_prod.dart \
              --dart-define-from-file=config/prod.json
            # `flutter build ios --no-codesign` emits Runner.app, not an IPA.
            # Package it into the standard IPA layout (Payload/Runner.app zip).
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
            ( cd build/ios/ipa && zip -qry HubMarket-unsigned.ipa Payload && rm -rf Payload )
            echo "Built unsigned IPA → build/ios/ipa/HubMarket-unsigned.ipa"
            ls -lh build/ios/ipa/*.ipa
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # OTA-distribute the IPA to Loadly (inert until LOADLY_API_KEY is set).
      # A signed ad-hoc IPA installs OTA for registered devices; an unsigned
      # one is still hosted (for sideload/resign) — matching the artifact above.
      - name: Distribute IPA to Loadly (when configured)
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          ipa="$(ls build/ios/ipa/*.ipa | head -n1)"
          bash tool/loadly_upload.sh "$ipa" "main @ ${GITHUB_SHA::7}"
