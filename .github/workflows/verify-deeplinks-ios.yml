name: Verify · iOS deep links

# Proves hubmarket://app/... URLs navigate on iOS (FlutterDeepLinkingEnabled).
# Simulator work is macOS-only, so this can't run on the Windows dev machine.
# Uploads the before/after frames so a failure can be eyeballed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/Runner/Info.plist"
      - "ios/Runner/AppDelegate.swift"
      # Runner.entitlements carries the (currently staged) associated-domains
      # key — the iOS half of "open the app if installed, else the browser".
      - "ios/Runner/Runner.entitlements"
      - "lib/app/router.dart"
      # The router only forwards unmatched locations; the resolver is where a
      # storefront URL actually becomes a PDP/PLP/WebView, so a change here is
      # exactly what this job exists to catch.
      - "lib/app/deep_link_resolver_screen.dart"
      - "lib/features/catalog/presentation/storefront_links.dart"
      # Decides which URLs reach Flutter at all on Android.
      - "android/app/src/main/AndroidManifest.xml"
      - "tool/ios_verify_deeplinks.sh"

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify deep links route
        run: bash tool/ios_verify_deeplinks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deeplink-verify-frames
          path: build/deeplink-verify/*.png
          if-no-files-found: warn
