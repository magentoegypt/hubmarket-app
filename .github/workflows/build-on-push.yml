name: Build · main (Android APK)

# On every push to main: run the CI gate (analyze + tests), then build the
# Android APK (debug-signed until the ANDROID_* secrets are set) and, when the
# LOADLY_API_KEY secret is set, publish an install link on Loadly.
# Artifact: apk-prod (download from the run). iOS is manual for now —
# .github/workflows/build-ios.yml — until Hub Market's Apple signing exists.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to main cancels an older in-progress run.
concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI gate: analyze + tests must pass before either platform builds. Runs on
  # ubuntu (reliable) so a macOS-runner hiccup never lets a red build through.
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      # Guards against schema/operation drift, mirroring CI.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  android-apk:
    needs: analyze-test
    runs-on: ubuntu-latest
    # Builds independently of the iOS job. The two are separate platform
    # artifacts — a broken (or, more often, a flaky macOS-runner startup)
    # iOS job must not block shipping the Android APK. Gating Android on iOS
    # meant a 2-second macOS allocation failure silently skipped the APK.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret — building a debug-signed APK (installable for testing, not Play-uploadable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (prod)
        run: >
          flutter build apk --release
          --flavor prod -t lib/main_prod.dart
          --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # OTA-distribute the APK to Loadly. Skips itself when LOADLY_API_KEY is
      # unset (see tool/loadly_upload.sh), so this is inert until the secret
      # is added — same opt-in-by-secret pattern as the keystore step above.
      - name: Distribute APK to Loadly (when configured)
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          apk="$(ls build/app/outputs/flutter-apk/*-release.apk | head -n1)"
          bash tool/loadly_upload.sh "$apk" "main @ ${GITHUB_SHA::7}"
