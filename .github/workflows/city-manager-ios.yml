name: City Manager iOS device checks
on:
  push:
    branches: [codex/city-manager]
    paths: [.github/workflows/city-manager-ios.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - name: Run on iPhone simulator
        shell: bash
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          flutter test integration_test/city_manager_native_test.dart -d "$DEVICE" --reporter expanded
